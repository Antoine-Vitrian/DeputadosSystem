<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 140" width="100%" height="100%">
  <defs>
    <style>
      .text-radar {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #FFFFFF;
      }
      .text-administrativo {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 400;
        font-size: 42px;
        fill: #38BDF8;
      }
    </style>
    
    <!-- Gradiente azul profundo, refinado e tecnológico -->
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>
  </defs>

  <!-- Grupo do Ícone (Radar + Gráfico de Análise de Dados) -->
  <g transform="translate(10, 10)">
    <!-- Base da Antena Parabólica -->
    <path d="M 35 110 L 65 110" stroke="url(#blueGrad)" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 50 110 L 50 95" stroke="url(#blueGrad)" stroke-width="6" stroke-linecap="round" fill="none" />
    
    <!-- Prato da Parabólica -->
    <path d="M 20 50 C 20 85, 55 100, 85 80 C 70 70, 45 45, 20 50 Z" fill="none" stroke="url(#blueGrad)" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Linhas de Transmissão / Ondas do Radar -->
    <path d="M 35 32 C 45 22, 65 22, 75 32" stroke="url(#blueGrad)" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 25 20 C 42 2, 73 2, 90 20" stroke="url(#blueGrad)" stroke-width="5" stroke-linecap="round" fill="none" />
    
    <!-- Gráfico de Barras Crescente Embutido (Análise Parlamentar) -->
    <rect x="42" y="70" width="8" height="15" rx="2" fill="url(#blueGrad)" opacity="0.7" />
    <rect x="55" y="60" width="8" height="25" rx="2" fill="url(#blueGrad)" opacity="0.85" />
    <rect x="68" y="48" width="8" height="37" rx="2" fill="url(#blueGrad)" />
    
    <!-- Seta de Tendência / Crescimento -->
    <path d="M 38 78 L 82 40" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <path d="M 74 40 L 82 40 L 82 48" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Grupo de Textos Alinhados Lado a Lado -->
  <g transform="translate(140, 82)">
    <text x="0" y="0" class="text-radar">RADAR</text>
    <!-- O espaçamento dinâmico posiciona "ADMINISTRATIVO" logo após "RADAR" -->
    <text x="165" y="0" class="text-administrativo">ADMINISTRATIVO</text>
  </g>
</svg>