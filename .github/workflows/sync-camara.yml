name: Atualizar dados da Câmara

on:
  schedule:
    - cron: "0 * * * *"
    - cron: "17 6 * * *"
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      carga:
        description: "Atualização recente, incremental ou carga inicial dos últimos 6 meses"
        type: choice
        options:
          - recente
          - incremental
          - ultimos_6_meses
        default: recente
        required: true

permissions:
  contents: read

concurrency:
  group: sync-camara
  cancel-in-progress: false

jobs:
  migrate:
    name: Aplicar migrações para sincronização
    if: (github.event_name == 'schedule' && github.event.schedule == '37 6 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.carga == 'incremental' || inputs.carga == 'ultimos_6_meses'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar acesso ao banco
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure o secret DATABASE_URL com a URL externa do PostgreSQL."
            exit 1
          fi

      - name: Aplicar migrações
        run: python manage.py migrate --noinput

  votacoes:
    name: Atualizar votações recentes
    if: (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.carga == 'recente')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar acesso ao banco
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure o secret DATABASE_URL com a URL externa do PostgreSQL."
            exit 1
          fi

      - name: Atualizar as dez votações mais recentes
        run: python manage.py sync_camara_diario

  parlamentares:
    name: Atualizar parlamentares
    if: (github.event_name == 'schedule' && github.event.schedule == '17 6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.carga == 'recente')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar acesso ao banco
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure o secret DATABASE_URL com a URL externa do PostgreSQL."
            exit 1
          fi

      - name: Atualizar parlamentares
        run: python manage.py sync_parlamentares

  incremental:
    name: Atualizar somente dados novos
    if: (github.event_name == 'schedule' && github.event.schedule == '37 6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.carga == 'incremental')
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar acesso ao banco
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure o secret DATABASE_URL com a URL externa do PostgreSQL."
            exit 1
          fi

      - name: Atualizar registros posteriores à carga histórica
        run: python manage.py sync_camara_incremental

  historico:
    name: Importar dados dos últimos 6 meses
    if: github.event_name == 'workflow_dispatch' && inputs.carga == 'ultimos_6_meses'
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar conexão
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure o secret DATABASE_URL com a URL externa do PostgreSQL."
            exit 1
          fi
      - name: Importar dados dos últimos 6 meses
        run: |
          python manage.py shell <<'PY'
          from calendar import monthrange
          from datetime import date

          from services.camara import (
              CamaraAPI,
              source,
              sync_deputies,
              sync_deputies_for_year,
              sync_expenses_month,
              sync_new_projects,
              sync_new_votings,
          )
          from django.utils import timezone

          year = timezone.localdate().year
          today = timezone.localdate()
          start_month_index = today.year * 12 + today.month - 1 - 6
          start_year = start_month_index // 12
          start_month = start_month_index % 12 + 1
          start_day = min(today.day, monthrange(start_year, start_month)[1])
          start_date = date(start_year, start_month, start_day)
          api = CamaraAPI()
          data_source = source()

          def report(label, count):
              print(f"{label}: {count}")
              if count == 0:
                  print(f"::warning::Dado não encontrado: {label} para {year}.")

          print(f"Sincronizando cadastro atual de parlamentares ({year})...")
          report("Parlamentares atuais", sync_deputies(api, data_source, year, year))

          print(f"Sincronizando mandatos de {year}...")
          report("Mandatos importados", sync_deputies_for_year(year, api))

          print(f"Importando projetos desde {start_date}...")
          report(
              "Projetos importados",
              sync_new_projects(api, data_source, start_date, today),
          )
          data_source.projects_synced_through = today
          data_source.save(update_fields=["projects_synced_through"])

          print(f"Importando votações nominais desde {start_date}...")
          report(
              "Votações importadas",
              sync_new_votings(api, data_source, start_date, today),
          )
          data_source.votings_synced_through = today
          data_source.save(update_fields=["votings_synced_through"])

          expenses_through = date(
              today.year - 1 if today.month == 1 else today.year,
              12 if today.month == 1 else today.month - 1,
              1,
          )
          expense_month_index = start_year * 12 + start_month - 1
          last_expense_month_index = (
              expenses_through.year * 12 + expenses_through.month - 1
          )
          expenses_imported = 0
          while expense_month_index <= last_expense_month_index:
              expense_year = expense_month_index // 12
              expense_month = expense_month_index % 12 + 1
              expenses_imported += sync_expenses_month(
                  api,
                  data_source,
                  expense_year,
                  expense_month,
              )
              expense_month_index += 1
          report("Despesas importadas", expenses_imported)
          data_source.expenses_synced_through = expenses_through
          data_source.save(update_fields=["expenses_synced_through"])

          data_source.last_parliamentarians_synced_at = timezone.now()
          data_source.save(update_fields=["last_parliamentarians_synced_at"])
          PY
